# SmartQueue — shared tool config (D-Docs, Phase 1.1).
# Currently Ruff-only, backend scope. Minimal clean rule set (syntax errors +
# pyflakes) so `ruff check` passes with no code refactor. Broader rule sets
# (isort, pyupgrade, bugbear, etc.) report 140+ findings owned by the
# API/services/tests agents — reported, not mass-edited here.

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]
exclude = [
    "__pycache__",
    ".pytest_cache",
    ".venv",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Unowned code findings (owners: schemas/API + tests agents). Ignored here so
# the checked-in config is green without touching code outside docs scope:
# - F401: unused `EmailStr` import in schemas (harmless, owner to remove).
# - F841: unused `appt` assignment in the queue lifecycle test (owner to fix).
"backend/app/schemas/schemas.py" = ["F401"]
"backend/tests/test_queue.py" = ["F841"]
